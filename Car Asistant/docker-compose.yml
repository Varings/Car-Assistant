version: '3.8'

services:
  car-assistant:
    build: .
    container_name: car-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=
      - MQTT_PASSWORD=
      - TORQUE_USER_EMAIL=lukasz@nostressit.co.uk
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
