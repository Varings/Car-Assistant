<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Assistant - Telemetria na żywo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.1);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-badge.online .status-dot {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 20px;
            width: 100%;
            text-align: left;
        }

        /* Circular Gauge Styles */
        .circular-gauge {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-blue) 0%, rgba(255,255,255,0.1) 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }
        
        .circular-gauge.rpm-gauge {
            background: conic-gradient(var(--accent-orange) 0%, rgba(255,255,255,0.1) 0%);
        }

        .gauge-inner {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gauge-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .gauge-unit {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Linear Bar Styles */
        .bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            margin: 15px 0;
        }

        .bar-fill {
            height: 100%;
            background: var(--accent-blue);
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .digital-readout {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 700;
        }

        /* Info rows */
        .info-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .info-value {
            font-weight: 600;
        }
        
        #ignition-status {
            font-size: 1.5rem;
            font-weight: 800;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .ign-on { color: var(--accent-green); text-shadow: 0 0 10px var(--accent-green); border: 1px solid var(--accent-green); }
        .ign-off { color: var(--accent-red); opacity: 0.5; border: 1px solid var(--accent-red); }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg> Car Assistant</h1>
        <div class="status-badge" id="conn-status">
            <div class="status-dot"></div>
            <span id="conn-text">OFFLINE</span>
        </div>
    </header>

    <div class="grid">
        <!-- Speed -->
        <div class="card">
            <div class="card-title">Prędkość</div>
            <div class="circular-gauge" id="speed-gauge">
                <div class="gauge-inner">
                    <div class="gauge-value" id="val-speed">0</div>
                    <div class="gauge-unit">km/h</div>
                </div>
            </div>
        </div>

        <!-- RPM -->
        <div class="card">
            <div class="card-title">Obroty Silnika</div>
            <div class="circular-gauge rpm-gauge" id="rpm-gauge">
                <div class="gauge-inner">
                    <div class="gauge-value" id="val-rpm">0</div>
                    <div class="gauge-unit">RPM</div>
                </div>
            </div>
        </div>

        <!-- Coolant & Load -->
        <div class="card">
            <div class="card-title">Silnik</div>
            
            <div class="info-row">
                <span>Temperatura</span>
                <span class="info-value"><span id="val-coolant">--</span> °C</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill" id="bar-coolant" style="background: var(--accent-blue);"></div>
            </div>

            <div class="info-row" style="margin-top: 15px;">
                <span>Obciążenie</span>
                <span class="info-value"><span id="val-load">--</span> %</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill" id="bar-load" style="background: var(--accent-orange);"></div>
            </div>
        </div>

        <!-- Battery & Fuel -->
        <div class="card">
            <div class="card-title">Zasilanie & Paliwo</div>
            
            <div class="digital-readout" style="color: var(--accent-green);" id="val-battery">--.-</div>
            <div class="gauge-unit" style="margin-bottom: 20px;">V Napięcie Akumulatora</div>

            <div class="info-row">
                <span>Poziom Paliwa</span>
                <span class="info-value"><span id="val-fuel">--</span> %</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill" id="bar-fuel" style="background: var(--accent-green);"></div>
            </div>
        </div>

        <!-- System Status -->
        <div class="card">
            <div class="card-title">Status Systemu</div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%;">
                <div id="ignition-status" class="ign-off">ZAPŁON OFF</div>
                
                <div style="margin-top: 30px; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                    <div class="info-row">
                        <span style="color: var(--text-muted); font-size: 0.8rem;">GPS LAT</span>
                        <span class="info-value" id="val-lat" style="font-size: 0.85rem;">--</span>
                    </div>
                    <div class="info-row">
                        <span style="color: var(--text-muted); font-size: 0.8rem;">GPS LON</span>
                        <span class="info-value" id="val-lon" style="font-size: 0.85rem;">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket setup
        let ws;
        const statusBadge = document.getElementById('conn-status');
        const statusText = document.getElementById('conn-text');

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusBadge.classList.add('online');
                statusText.innerText = 'ONLINE / LIVE';
            };

            ws.onclose = () => {
                statusBadge.classList.remove('online');
                statusText.innerText = 'OFFLINE';
                setTimeout(connectWebSocket, 2000); // Auto reconnect
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                ws.close();
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateDashboard(data);
            };
        }

        function updateDashboard(data) {
            // Update Speed (Max 240)
            const speed = data.speed || 0;
            document.getElementById('val-speed').innerText = Math.round(speed);
            const speedPct = Math.min((speed / 240) * 100, 100);
            document.getElementById('speed-gauge').style.background = `conic-gradient(var(--accent-blue) ${speedPct}%, rgba(255,255,255,0.1) ${speedPct}%)`;

            // Update RPM (Max 8000)
            const rpm = data.rpm || 0;
            document.getElementById('val-rpm').innerText = Math.round(rpm);
            const rpmPct = Math.min((rpm / 8000) * 100, 100);
            const rpmColor = rpm > 6000 ? 'var(--accent-red)' : 'var(--accent-orange)';
            document.getElementById('rpm-gauge').style.background = `conic-gradient(${rpmColor} ${rpmPct}%, rgba(255,255,255,0.1) ${rpmPct}%)`;

            // Update Coolant (Max 120)
            const coolant = data.coolant_temp || 0;
            document.getElementById('val-coolant').innerText = Math.round(coolant);
            const coolantPct = Math.min((coolant / 120) * 100, 100);
            const coolantBar = document.getElementById('bar-coolant');
            coolantBar.style.width = `${coolantPct}%`;
            coolantBar.style.background = coolant > 100 ? 'var(--accent-red)' : 'var(--accent-blue)';

            // Update Load
            const load = data.engine_load || 0;
            document.getElementById('val-load').innerText = Math.round(load);
            document.getElementById('bar-load').style.width = `${Math.min(load, 100)}%`;

            // Update Battery
            const battery = data.battery_voltage || 0;
            const batEl = document.getElementById('val-battery');
            batEl.innerText = battery.toFixed(1);
            if (battery < 12.0) batEl.style.color = 'var(--accent-red)';
            else if (battery > 13.5) batEl.style.color = 'var(--accent-green)';
            else batEl.style.color = 'var(--accent-orange)';

            // Update Fuel
            const fuel = data.fuel_level || 0;
            document.getElementById('val-fuel').innerText = Math.round(fuel);
            const fuelBar = document.getElementById('bar-fuel');
            fuelBar.style.width = `${Math.min(fuel, 100)}%`;
            if (fuel < 15) fuelBar.style.background = 'var(--accent-red)';
            else fuelBar.style.background = 'var(--accent-green)';

            // Update Ignition Status
            const ignEl = document.getElementById('ignition-status');
            if (data.ignition) {
                ignEl.className = 'ign-on';
                ignEl.innerText = 'ZAPŁON WŁĄCZONY';
            } else {
                ignEl.className = 'ign-off';
                ignEl.innerText = 'ZAPŁON WYŁĄCZONY';
            }

            // Update GPS
            document.getElementById('val-lat').innerText = data.latitude ? data.latitude.toFixed(6) : 'Brak danych';
            document.getElementById('val-lon').innerText = data.longitude ? data.longitude.toFixed(6) : 'Brak danych';
        }

        // Initialize
        connectWebSocket();
    </script>
</body>
</html>
